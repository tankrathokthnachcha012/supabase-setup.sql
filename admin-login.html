<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ Admin</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="back-link" href="index.html">← กลับหน้าลงทะเบียน</a>
    <div class="login-icon">🔐</div>
    <h1>เข้าสู่ระบบ Admin</h1>
    <p>สำหรับผู้ดูแลระบบเท่านั้น</p>
    <form id="loginForm">
      <label>อีเมล<input name="email" type="email" required autocomplete="username" placeholder="อีเมลผู้ดูแล"></label>
      <label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password" placeholder="รหัสผ่าน"></label>
      <button class="btn" type="submit">เข้าสู่ระบบ</button>
      <p id="loginMessage" class="message" role="status"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script><script src="js/admin-login.js"></script>
</body>
</html>
